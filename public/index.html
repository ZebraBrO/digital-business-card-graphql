<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dmitrii Sivirin | Digital Business Card (GraphQL)</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #263449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --badge-bg: rgba(56, 189, 248, 0.12);
      --nda-bg: rgba(245, 158, 11, 0.14);
      --nda-text: #fbbf24;
      --open-bg: rgba(34, 197, 94, 0.14);
      --open-text: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      letter-spacing: 0.03em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .btn-group {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .btn-group button {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-group button.active {
      background: var(--accent-dark);
      color: #fff;
    }

    .sandbox-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #0f172a;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.84rem;
      padding: 7px 14px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }

    .sandbox-link:hover {
      opacity: 0.9;
    }

    .container {
      max-width: 1100px;
      margin: 32px auto 0;
      padding: 0 24px;
    }

    .hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 28px;
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .hero .subtitle {
      color: var(--accent);
      font-size: 1.08rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    .hero .summary {
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.9rem;
      color: var(--muted);
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .meta-row a {
      color: var(--accent);
      text-decoration: none;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .card p {
      color: #cbd5e1;
      font-size: 0.92rem;
      margin-bottom: 12px;
    }

    ul.achievements {
      padding-left: 18px;
      color: #cbd5e1;
      font-size: 0.92rem;
    }

    ul.achievements li {
      margin-bottom: 6px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      background: var(--badge-bg);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .badge.nda {
      background: var(--nda-bg);
      color: var(--nda-text);
    }

    .badge.open {
      background: var(--open-bg);
      color: var(--open-text);
    }

    .cert-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cert-row:last-child {
      border-bottom: none;
    }

    .cert-code {
      background: var(--badge-bg);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .inspector {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.82rem;
      color: #93c5fd;
      overflow-x: auto;
      white-space: pre;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">DIGITAL BUSINESS CARD // GRAPHQL API</div>
      <div class="controls">
        <div class="btn-group" id="langSwitch">
          <button type="button" data-lang="EN" class="active">EN</button>
          <button type="button" data-lang="RU">RU</button>
        </div>
        <div class="btn-group" id="strategySwitch">
          <button type="button" data-strategy="DATALOADER" class="active" title="Batching via DataLoader">DataLoader</button>
          <button type="button" data-strategy="AST_JOIN" title="Single query via @Info AST lookahead">AST Join</button>
        </div>
        <a class="sandbox-link" href="/graphql" target="_blank" rel="noopener">Apollo Sandbox &rarr;</a>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="hero">Loading profile from /graphql...</div>
  </main>

  <script>
    let currentLang = 'EN';
    let currentStrategy = 'DATALOADER';

    const UI_LABELS = {
      EN: {
        skills: 'Technical Skills',
        experience: 'Commercial Work Experience',
        projects: 'Projects & Enterprise Systems',
        certifications: 'Professional Certifications',
        queryTitle: 'Live GraphQL Request',
        nda: 'Corporate NDA',
        openSource: 'Open Source',
      },
      RU: {
        skills: 'Технические навыки',
        experience: 'Коммерческий опыт работы',
        projects: 'Проекты и корпоративные системы',
        certifications: 'Профессиональные сертификации',
        queryTitle: 'Текущий GraphQL-запрос',
        nda: 'Корпоративный NDA',
        openSource: 'Open Source',
      },
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadProfile() {
      const query = `query GetDigitalCard($lang: Language!, $strategy: OptimizationStrategy!) {
  profile(lang: $lang, strategy: $strategy) {
    name
    title
    description
    location
    email
    phone
    telegram
    links { platform url }
    skills { category name }
    experience { company position period achievements }
    projects { name description url techStack isNda }
    certifications { code title issuer year }
  }
}`;

      const startTime = performance.now();
      const response = await fetch('/graphql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query,
          variables: { lang: currentLang, strategy: currentStrategy },
        }),
      });
      const result = await response.json();
      const elapsedMs = Math.round(performance.now() - startTime);

      if (!result.data || !result.data.profile) {
        document.getElementById('app').innerHTML = '<div class="hero">Failed to load profile data.</div>';
        return;
      }

      renderProfile(result.data.profile, query, elapsedMs);
    }

    function renderProfile(p, queryText, elapsedMs) {
      const t = UI_LABELS[currentLang];

      const skillsByCategory = {};
      for (const s of p.skills) {
        if (!skillsByCategory[s.category]) skillsByCategory[s.category] = [];
        skillsByCategory[s.category].push(s.name);
      }

      const skillsHtml = Object.entries(skillsByCategory)
        .map(
          ([cat, items]) => `
          <div class="card">
            <h3>${escapeHtml(cat)}</h3>
            <div class="tags">
              ${items.map((item) => `<span class="tag">${escapeHtml(item)}</span>`).join('')}
            </div>
          </div>`
        )
        .join('');

      const expHtml = p.experience
        .map(
          (e) => `
          <div class="card" style="margin-bottom: 16px;">
            <h3>${escapeHtml(e.company)}</h3>
            <div class="card-meta">${escapeHtml(e.position)} &bull; ${escapeHtml(e.period)}</div>
            <ul class="achievements">
              ${e.achievements.map((a) => `<li>${escapeHtml(a)}</li>`).join('')}
            </ul>
          </div>`
        )
        .join('');

      const projectsHtml = p.projects
        .map(
          (pr) => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">
              <h3>${escapeHtml(pr.name)}</h3>
              <span class="badge ${pr.isNda ? 'nda' : 'open'}">${pr.isNda ? t.nda : t.openSource}</span>
            </div>
            <p>${escapeHtml(pr.description)}</p>
            <div style="font-size:0.82rem; color:var(--muted); margin-bottom:8px;">
              ${
                pr.url.startsWith('http')
                  ? `<a href="${escapeHtml(pr.url)}" target="_blank" rel="noopener" style="color:var(--accent);">${escapeHtml(pr.url)}</a>`
                  : escapeHtml(pr.url)
              }
            </div>
            <div class="tags">
              ${pr.techStack.map((tech) => `<span class="tag">${escapeHtml(tech)}</span>`).join('')}
            </div>
          </div>`
        )
        .join('');

      const certsHtml = p.certifications
        .map(
          (c) => `
          <div class="cert-row">
            <div>
              <strong>${escapeHtml(c.title)}</strong>
              <div style="font-size:0.85rem; color:var(--muted);">${escapeHtml(c.issuer)} (${c.year})</div>
            </div>
            <span class="cert-code">${escapeHtml(c.code)}</span>
          </div>`
        )
        .join('');

      const linksHtml = p.links
        .map(
          (l) => `<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.platform)}</a>`
        )
        .join(' &bull; ');

      document.getElementById('app').innerHTML = `
        <section class="hero">
          <h1>${escapeHtml(p.name)}</h1>
          <div class="subtitle">${escapeHtml(p.title)}</div>
          <div class="summary">${escapeHtml(p.description)}</div>
          <div class="meta-row">
            <span>${escapeHtml(p.location)}</span>
            <span>${escapeHtml(p.phone)}</span>
            <span>${linksHtml}</span>
          </div>
        </section>

        <section class="section">
          <div class="section-title">${t.skills}</div>
          <div class="grid-2">${skillsHtml}</div>
        </section>

        <section class="section">
          <div class="section-title">${t.experience}</div>
          ${expHtml}
        </section>

        <section class="section">
          <div class="section-title">${t.projects}</div>
          <div class="grid-2">${projectsHtml}</div>
        </section>

        <section class="section">
          <div class="section-title">${t.certifications}</div>
          <div class="card">${certsHtml}</div>
        </section>

        <section class="section">
          <div class="section-title">
            <span>${t.queryTitle}</span>
            <span style="font-size:0.85rem; color:var(--accent);">Strategy: ${currentStrategy} | ${elapsedMs} ms</span>
          </div>
          <div class="inspector">${escapeHtml(queryText)}</div>
        </section>
      `;
    }

    document.getElementById('langSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-lang]');
      if (!btn) return;
      currentLang = btn.dataset.lang;
      document.querySelectorAll('#langSwitch button').forEach((b) => b.classList.toggle('active', b === btn));
      loadProfile();
    });

    document.getElementById('strategySwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-strategy]');
      if (!btn) return;
      currentStrategy = btn.dataset.strategy;
      document.querySelectorAll('#strategySwitch button').forEach((b) => b.classList.toggle('active', b === btn));
      loadProfile();
    });

    loadProfile();
  </script>
</body>
</html>
