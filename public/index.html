<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dmitrii Sivirin | Full-Stack & Back-End Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-void: #07050c;
      --bg-deep: #0d0917;
      --surface: rgba(20, 14, 36, 0.65);
      --surface-solid: #140e24;
      --surface-hover: rgba(30, 21, 54, 0.8);
      --border: rgba(168, 130, 255, 0.13);
      --border-strong: rgba(168, 130, 255, 0.28);
      --text-main: #f2eefc;
      --text-secondary: #c4bad9;
      --text-muted: #84789e;
      --accent: #a78bfa;
      --accent-bright: #c4b5fd;
      --accent-dim: rgba(139, 92, 246, 0.14);
      --mono: 'JetBrains Mono', Consolas, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background-color: var(--bg-void);
      color: var(--text-main);
      line-height: 1.65;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Фоновое свечение и легкая зернистость (намек на глубокий космос без иллюстраций) */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 14% 18%, rgba(91, 33, 182, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 86% 12%, rgba(124, 58, 237, 0.11) 0%, transparent 40%),
        radial-gradient(circle at 70% 78%, rgba(76, 29, 149, 0.15) 0%, transparent 50%),
        linear-gradient(180deg, #090612 0%, #06040a 100%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        radial-gradient(rgba(196, 181, 253, 0.05) 1px, transparent 1px);
      background-size: 96px 96px, 160px 160px;
      background-position: 0 0, 42px 64px;
      opacity: 0.55;
      pointer-events: none;
    }

    a {
      color: var(--accent-bright);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: #ffffff;
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 44px 32px 80px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 56px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 36px;
        padding: 24px 18px 60px;
      }
    }

    /* Левая колонка (фиксированный профиль и управление) */
    .sidebar {
      position: sticky;
      top: 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    @media (max-width: 980px) {
      .sidebar {
        position: static;
      }
    }

    .identity-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px 24px;
      backdrop-filter: blur(12px);
    }

    .status-line {
      font-family: var(--mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-bright);
      box-shadow: 0 0 10px var(--accent);
    }

    .name {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .role {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.85rem;
    }

    .contact-list li {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .contact-value {
      color: var(--text-secondary);
      word-break: break-word;
    }

    .links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    .links-row a {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: rgba(139, 92, 246, 0.06);
    }

    .links-row a:hover {
      border-color: var(--border-strong);
      background: rgba(139, 92, 246, 0.16);
    }

    /* Панель управления GraphQL и языком */
    .control-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px 24px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .control-title {
      font-family: var(--mono);
      font-size: 0.73rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .segmented {
      display: inline-flex;
      border: 1px solid var(--border);
      background: var(--bg-void);
    }

    .segmented button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 0.74rem;
      padding: 5px 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .segmented button.active {
      background: var(--accent-dim);
      color: var(--accent-bright);
      font-weight: 600;
    }

    .apollo-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border-strong);
      background: rgba(139, 92, 246, 0.12);
      color: var(--text-main);
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      margin-top: 4px;
      transition: background 0.15s, border-color 0.15s;
    }

    .apollo-btn:hover {
      background: rgba(139, 92, 246, 0.24);
      border-color: var(--accent-bright);
    }

    /* Правая основная колонка */
    .content {
      display: flex;
      flex-direction: column;
      gap: 52px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .section-index {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .section-name {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .summary-block {
      font-size: 1.02rem;
      color: var(--text-secondary);
      line-height: 1.75;
      border-left: 2px solid var(--accent);
      padding-left: 20px;
    }

    /* Таймлайн опыта работы */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 32px;
      border-left: 1px solid var(--border-strong);
      padding-left: 26px;
      margin-left: 6px;
    }

    .timeline-item {
      position: relative;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -30px;
      top: 7px;
      width: 7px;
      height: 7px;
      background: var(--bg-void);
      border: 2px solid var(--accent);
    }

    .exp-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .exp-company {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .exp-period {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
    }

    .exp-position {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .exp-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .exp-list li {
      position: relative;
      padding-left: 16px;
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .exp-list li::before {
      content: '>';
      position: absolute;
      left: 0;
      top: 0;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
    }

    /* Проекты (строгий реестр без шаблонных карточек) */
    .projects-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .project-row {
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .project-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .project-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .project-access {
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 2px 8px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .project-access.open {
      border-color: rgba(167, 139, 250, 0.4);
      color: var(--accent-bright);
      background: var(--accent-dim);
    }

    .project-desc {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    .project-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .stack-inline {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--accent);
    }

    .project-link {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    /* Таблица навыков */
    .skills-table {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .skill-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
    }

    @media (max-width: 640px) {
      .skill-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    .skill-cat {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .skill-items {
      font-size: 0.92rem;
      color: var(--text-secondary);
    }

    /* Сертификации */
    .cert-table {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
    }

    .cert-item {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
      font-size: 0.9rem;
    }

    @media (max-width: 640px) {
      .cert-item {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }

    .cert-code {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--accent-bright);
      font-weight: 600;
    }

    .cert-title {
      color: var(--text-secondary);
    }

    .cert-meta {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Блок телеметрии GraphQL */
    .telemetry-box {
      background: #050309;
      border: 1px solid var(--border);
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-secondary);
      overflow-x: auto;
      white-space: pre;
      line-height: 1.55;
    }

    .telemetry-meta {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="identity-panel" id="sidebarProfile">
        <div class="status-line">
          <span class="status-dot"></span>
          <span>GRAPHQL NODE // ONLINE</span>
        </div>
        <div class="name">Loading...</div>
      </div>

      <div class="control-panel">
        <div class="control-group">
          <span class="control-title">Locale</span>
          <div class="segmented" id="langSwitch">
            <button type="button" data-lang="EN" class="active">EN</button>
            <button type="button" data-lang="RU">RU</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-title">Resolver Mode</span>
          <div class="segmented" id="strategySwitch">
            <button type="button" data-strategy="DATALOADER" class="active">DataLoader</button>
            <button type="button" data-strategy="AST_JOIN">AST Join</button>
          </div>
        </div>
        <a class="apollo-btn" href="/graphql" target="_blank" rel="noopener">
          <span>Open Apollo Sandbox</span>
          <span>/graphql &rarr;</span>
        </a>
      </div>
    </aside>

    <main class="content" id="mainContent">
      <div>Fetching data from GraphQL endpoint...</div>
    </main>
  </div>

  <script>
    let currentLang = 'EN';
    let currentStrategy = 'DATALOADER';

    const LABELS = {
      EN: {
        about: 'Overview',
        experience: 'Commercial Experience',
        projects: 'Selected Systems & Projects',
        skills: 'Technical Stack',
        certs: 'Certifications',
        telemetry: 'GraphQL Query Telemetry',
        location: 'Location',
        phone: 'Phone',
        email: 'Email',
        telegram: 'Telegram',
        nda: 'INTERNAL / NDA',
        open: 'OPEN SOURCE',
      },
      RU: {
        about: 'Профиль',
        experience: 'Коммерческий опыт',
        projects: 'Проекты и внедренные системы',
        skills: 'Технический стек',
        certs: 'Сертификации',
        telemetry: 'Телеметрия GraphQL-запроса',
        location: 'Локация',
        phone: 'Телефон',
        email: 'Почта',
        telegram: 'Telegram',
        nda: ' ВНУТРЕННИЙ / NDA',
        open: 'OPEN SOURCE',
      },
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function fetchProfile() {
      const query = `query GetDigitalCard($lang: Language!, $strategy: OptimizationStrategy!) {
  profile(lang: $lang, strategy: $strategy) {
    name
    title
    description
    location
    email
    phone
    telegram
    links { platform url }
    skills { category name }
    experience { company position period achievements }
    projects { name description url techStack isNda }
    certifications { code title issuer year }
  }
}`;

      const t0 = performance.now();
      const res = await fetch('/graphql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query,
          variables: { lang: currentLang, strategy: currentStrategy },
        }),
      });
      const payload = await res.json();
      const durationMs = Math.round(performance.now() - t0);

      if (!payload.data || !payload.data.profile) return;
      render(payload.data.profile, query, durationMs);
    }

    function render(p, query, durationMs) {
      const l = LABELS[currentLang];

      document.getElementById('sidebarProfile').innerHTML = `
        <div class="status-line">
          <span class="status-dot"></span>
          <span>GRAPHQL NODE // ONLINE</span>
        </div>
        <h1 class="name">${escapeHtml(p.name)}</h1>
        <div class="role">${escapeHtml(p.title)}</div>
        <ul class="contact-list">
          <li>
            <span class="contact-label">${l.location}</span>
            <span class="contact-value">${escapeHtml(p.location)}</span>
          </li>
          <li>
            <span class="contact-label">${l.email}</span>
            <span class="contact-value"><a href="mailto:${escapeHtml(p.email)}">${escapeHtml(p.email)}</a></span>
          </li>
          <li>
            <span class="contact-label">${l.phone}</span>
            <span class="contact-value">${escapeHtml(p.phone)}</span>
          </li>
          <li>
            <span class="contact-label">${l.telegram}</span>
            <span class="contact-value">${escapeHtml(p.telegram)}</span>
          </li>
        </ul>
        <div class="links-row">
          ${p.links
            .map(
              (item) =>
                `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.platform)}</a>`
            )
            .join('')}
        </div>
      `;

      const groupedSkills = {};
      for (const s of p.skills) {
        if (!groupedSkills[s.category]) groupedSkills[s.category] = [];
        groupedSkills[s.category].push(s.name);
      }

      const skillsHtml = Object.entries(groupedSkills)
        .map(
          ([cat, list]) => `
          <div class="skill-row">
            <div class="skill-cat">${escapeHtml(cat)}</div>
            <div class="skill-items">${list.map(escapeHtml).join('  /  ')}</div>
          </div>`
        )
        .join('');

      const expHtml = p.experience
        .map(
          (e) => `
          <article class="timeline-item">
            <div class="exp-header">
              <h3 class="exp-company">${escapeHtml(e.company)}</h3>
              <span class="exp-period">${escapeHtml(e.period)}</span>
            </div>
            <div class="exp-position">${escapeHtml(e.position)}</div>
            <ul class="exp-list">
              ${e.achievements.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}
            </ul>
          </article>`
        )
        .join('');

      const projectsHtml = p.projects
        .map(
          (pr) => `
          <article class="project-row">
            <div class="project-top">
              <h3 class="project-title">${escapeHtml(pr.name)}</h3>
              <span class="project-access ${pr.isNda ? '' : 'open'}">${pr.isNda ? l.nda : l.open}</span>
            </div>
            <p class="project-desc">${escapeHtml(pr.description)}</p>
            <div class="project-footer">
              <span class="stack-inline">[ ${pr.techStack.map(escapeHtml).join(' · ')} ]</span>
              <span class="project-link">
                ${
                  pr.url.startsWith('http')
                    ? `<a href="${escapeHtml(pr.url)}" target="_blank" rel="noopener">${escapeHtml(pr.url)} &nearr;</a>`
                    : escapeHtml(pr.url)
                }
              </span>
            </div>
          </article>`
        )
        .join('');

      const certsHtml = p.certifications
        .map(
          (c) => `
          <div class="cert-item">
            <span class="cert-code">${escapeHtml(c.code)}</span>
            <span class="cert-title">${escapeHtml(c.title)}</span>
            <span class="cert-meta">${escapeHtml(c.issuer)} · ${c.year}</span>
          </div>`
        )
        .join('');

      document.getElementById('mainContent').innerHTML = `
        <section>
          <div class="section-header">
            <span class="section-index">01</span>
            <h2 class="section-name">${l.about}</h2>
          </div>
          <p class="summary-block">${escapeHtml(p.description)}</p>
        </section>

        <section>
          <div class="section-header">
            <span class="section-index">02</span>
            <h2 class="section-name">${l.experience}</h2>
          </div>
          <div class="timeline">${expHtml}</div>
        </section>

        <section>
          <div class="section-header">
            <span class="section-index">03</span>
            <h2 class="section-name">${l.projects}</h2>
          </div>
          <div class="projects-list">${projectsHtml}</div>
        </section>

        <section>
          <div class="section-header">
            <span class="section-index">04</span>
            <h2 class="section-name">${l.skills}</h2>
          </div>
          <div class="skills-table">${skillsHtml}</div>
        </section>

        <section>
          <div class="section-header">
            <span class="section-index">05</span>
            <h2 class="section-name">${l.certs}</h2>
          </div>
          <div class="cert-table">${certsHtml}</div>
        </section>

        <section>
          <div class="section-header">
            <span class="section-index">06</span>
            <h2 class="section-name">${l.telemetry}</h2>
          </div>
          <div class="telemetry-meta">
            <span>POST /graphql (variables: lang=${currentLang}, strategy=${currentStrategy})</span>
            <span>${durationMs} ms</span>
          </div>
          <div class="telemetry-box">${escapeHtml(query)}</div>
        </section>
      `;
    }

    document.getElementById('langSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-lang]');
      if (!btn) return;
      currentLang = btn.dataset.lang;
      document.querySelectorAll('#langSwitch button').forEach((b) => b.classList.toggle('active', b === btn));
      fetchProfile();
    });

    document.getElementById('strategySwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-strategy]');
      if (!btn) return;
      currentStrategy = btn.dataset.strategy;
      document.querySelectorAll('#strategySwitch button').forEach((b) => b.classList.toggle('active', b === btn));
      fetchProfile();
    });

    fetchProfile();
  </script>
